<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DevOps Presentation – Tim Huza</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--surface:#161b22;--border:#30363d;
  --text:#e6edf3;--muted:#8b949e;
  --accent:#f97316;--blue:#58a6ff;--cyan:#06b6d4;
}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  overflow:hidden}

/* shell */
.deck{position:relative;width:100vw;height:100vh;overflow:hidden}
.slide{
  position:absolute;inset:0;bottom:52px;
  display:none;flex-direction:column;overflow:hidden;
  background:var(--bg);
}
.slide.active{display:flex}

/* TITLE SLIDE */
.title-wrap{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;height:100%;text-align:center;
  background:radial-gradient(ellipse at 50% 0%,#1e1b4b 0%,#0d1117 70%);
  padding:2rem;
}
.title-wrap .hero-icon{font-size:6rem;margin-bottom:1rem;
  filter:drop-shadow(0 0 30px rgba(249,115,22,.5))}
.title-wrap h1{
  font-size:clamp(2.2rem,5vw,4rem);font-weight:800;
  background:linear-gradient(90deg,#f97316,#f59e0b);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  margin-bottom:.5rem;letter-spacing:-1px;
}
.title-wrap .sub{font-size:1.15rem;color:var(--muted);margin-bottom:1.5rem}
.title-wrap .author{
  display:inline-flex;align-items:center;gap:.5rem;
  background:var(--surface);border:1px solid var(--border);
  border-radius:999px;padding:.45rem 1.4rem;font-size:1rem;
  font-weight:600;margin-bottom:2rem;
}
.chips{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;max-width:520px}
.chip{
  background:var(--surface);border:1px solid var(--border);
  border-radius:8px;padding:.4rem .9rem;font-size:.82rem;color:var(--muted);
}

/* CONTENT SLIDE */
.s-head{
  display:flex;align-items:center;gap:1rem;
  padding:.9rem 2rem;background:var(--surface);
  border-bottom:3px solid var(--accent);flex-shrink:0;
}
.s-num{
  font-size:2rem;font-weight:900;min-width:3rem;
  background:linear-gradient(135deg,var(--accent),#f59e0b);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.s-title{font-size:1.5rem;font-weight:700}
.s-logo{height:42px;object-fit:contain;margin-left:auto;
  filter:drop-shadow(0 0 6px rgba(255,255,255,.15))}

.s-body{
  flex:1;overflow-y:auto;padding:1.4rem 2rem 1rem;
  display:flex;flex-direction:column;gap:.6rem;
}
.s-body::-webkit-scrollbar{width:5px}
.s-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* two-col */
.cols{display:grid;grid-template-columns:1fr auto;gap:1.5rem;align-items:start}
.cols img{max-height:260px;
  border-radius:10px;border:1px solid var(--border);
  object-fit:contain;background:var(--surface);padding:.4rem}
@media(max-width:700px){.cols{grid-template-columns:1fr}}

/* single centered image */
.img-center{
  display:block;max-width:100%;max-height:280px;
  object-fit:contain;border-radius:10px;
  border:1px solid var(--border);background:var(--surface);
  padding:.5rem;margin:.4rem auto;
}

/* typography */
h2{font-size:1.35rem;font-weight:700;color:var(--blue);
  padding-left:.7rem;border-left:3px solid var(--accent);margin-top:.6rem}
h3{font-size:1.05rem;font-weight:600;color:var(--text);margin-top:.7rem}
p{line-height:1.7;color:#c9d1d9}
strong{color:var(--text)}
ul,ol{margin:.3rem 0 .3rem 1.4rem;color:#c9d1d9}
li{margin:.25rem 0;line-height:1.6}
ul li::marker{color:var(--accent)}
ol li::marker{color:var(--blue);font-weight:700}

/* tip */
.tip{
  background:rgba(6,182,212,.08);border-left:3px solid var(--cyan);
  border-radius:0 8px 8px 0;padding:.5rem 1rem;
  color:#67e8f9;font-size:.95rem;
}
.warn{
  background:rgba(249,115,22,.08);border-left:3px solid var(--accent);
  border-radius:0 8px 8px 0;padding:.5rem 1rem;
  color:#fdba74;font-size:.95rem;
}

/* code */
code{
  font-family:Consolas,'JetBrains Mono','Courier New',monospace;
  font-size:.84em;background:#1a2233;color:#79c0ff;
  padding:.1em .35em;border-radius:4px;
}
pre{
  background:#0d1117;border:1px solid var(--border);border-radius:10px;
  padding:1rem 1.2rem;overflow-x:auto;margin:.4rem 0;
}
pre code{background:transparent;color:#e6edf3;padding:0;font-size:.88rem;line-height:1.65}

/* table */
.tw{overflow-x:auto;margin:.4rem 0}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{background:#1f2937;color:var(--text);font-weight:600;
   padding:.55rem .9rem;border:1px solid var(--border);text-align:left}
td{padding:.5rem .9rem;border:1px solid var(--border);color:#c9d1d9}
tr:hover td{background:rgba(249,115,22,.05)}

/* key takeaway box */
.takeaway{
  background:linear-gradient(135deg,rgba(249,115,22,.12),rgba(245,158,11,.08));
  border:1px solid rgba(249,115,22,.3);border-radius:12px;
  padding:1.2rem 1.5rem;margin-top:.8rem;
}
.takeaway p{color:#fdba74;font-size:1.05rem;line-height:1.7}

/* simple explanation box */
.simple-box{
  background:rgba(139,92,246,.08);border-left:3px solid var(--accent);
  border-radius:0 8px 8px 0;padding:.8rem 1.2rem;margin-top:.8rem;
}
.simple-box h3{margin-top:0;color:var(--accent);display:flex;align-items:center;gap:.5rem;font-size:1.05rem}
.simple-box p{font-size:.95rem;line-height:1.6}

/* summary grid */
.sum-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:.75rem;margin-top:.5rem;
}
.sum-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:.75rem 1rem;font-size:.9rem;color:#c9d1d9;
  cursor:default;
  transition:border-color .2s, transform .2s, box-shadow .2s;
}
.sum-card:hover{
  border-color:var(--accent);
  transform:translateY(-3px);
  box-shadow:0 6px 20px rgba(249,115,22,.18);
}
.sum-card .ico{font-size:1.4rem;display:block;margin-bottom:.3rem}

/* tooltip pointing out of the card */
.sum-card{
  position:relative;
}
.sum-card .tooltip{
  position:absolute;
  bottom:calc(100% + 10px);
  left:50%;
  transform:translateX(-50%) translateY(8px);
  background:rgba(15,20,30,.98);
  border:1px solid rgba(249,115,22,.45);
  border-radius:8px;
  padding:.75rem 1rem;
  font-size:.85rem;
  color:#e6edf3;
  line-height:1.5;
  white-space:normal;
  min-width:220px;
  max-width:280px;
  text-align:center;
  pointer-events:none;
  opacity:0;
  transition:opacity .25s ease, transform .25s ease;
  z-index:100;
  box-shadow:0 8px 24px rgba(0,0,0,.6);
}
.sum-card:hover .tooltip{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* nav */
.nav{
  position:fixed;bottom:0;left:0;right:0;height:52px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 1.2rem;
  background:rgba(13,17,23,.97);backdrop-filter:blur(12px);
  border-top:1px solid var(--border);z-index:999;
}
.nbtn{
  background:var(--surface);border:1px solid var(--border);
  color:var(--text);padding:.4rem 1.1rem;border-radius:8px;
  font-size:.88rem;font-weight:500;cursor:pointer;transition:all .18s;
}
.nbtn:hover{border-color:var(--accent);color:var(--accent)}
.nbtn:disabled{opacity:.3;cursor:not-allowed}
.nav-mid{display:flex;align-items:center;gap:.5rem}
.dot{
  width:8px;height:8px;border-radius:50%;background:var(--border);
  cursor:pointer;border:none;transition:all .2s;padding:0;
}
.dot.on{background:var(--accent);transform:scale(1.5)}
.ctr{font-size:.8rem;color:var(--muted);margin-left:.4rem;min-width:50px;text-align:center}
/* per-topic accent overrides */
.net{--accent:#06b6d4}
.git-gh{--accent:#f43f5e}
.jenkins{--accent:#8b5cf6}
.cicd{--accent:#10b981}
.pipe{--accent:#eab308}
.docker{--accent:#3b82f6}
.k8s{--accent:#326ce5}
.ansible{--accent:#dc2626}
.terraform{--accent:#844FBA}
.iac{--accent:#14b8a6}
.python{--accent:#ca8a04}

/* Linux company logo slider */
.linux-slider-box {
  width: 260px;
  height: 150px;
  background: #fff;
  border: 1px solid #e1e4e8;
  border-radius: 16px;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  margin: 1rem 0;
  position: relative;
  box-shadow: 0 8px 24px rgba(0,0,0,0.35);
}
.linux-slider-box img {
  position: absolute;
  max-width: 72%;
  max-height: 72%;
  object-fit: contain;
  opacity: 0;
  transition: opacity 0.5s ease;
}
.linux-slider-box img.active {
  opacity: 1;
}
</style>
</head>
<body>
<div class="deck" id="deck">
  <!-- slides are injected here by JS -->
  <div id="loading" style="
    display:flex;align-items:center;justify-content:center;
    height:100%;flex-direction:column;gap:1rem;color:var(--muted)">
    <div style="font-size:3rem">⚙️</div>
    <p style="font-size:1.1rem">Loading presentation…</p>
  </div>
</div>

<!-- ═══════════════ NAV ═══════════════ -->
<nav class="nav">
  <button class="nbtn" id="btn-prev">&#8592; Prev</button>
  <div class="nav-mid" id="nav-dots">
    <!-- dots injected after load -->
    <span class="ctr" id="ctr">— / —</span>
  </div>
  <button class="nbtn" id="btn-next">Next &#8594;</button>
</nav>

<script>
// Section template files (in order)
const TEMPLATE_FILES = [
  'templates/00-title.html',
  'templates/01-linux.html',
  'templates/02-network-basics.html',
  'templates/03-git-github.html',
  'templates/04-jenkins.html',
  'templates/05-cicd.html',
  'templates/06-pipelines.html',
  'templates/07-docker.html',
  'templates/08-kubernetes.html',
  'templates/09-ansible.html',
  'templates/10-terraform.html',
  'templates/11-iac.html',
  'templates/12-python.html'
];

let cur = 0;
let slides = [];
let dots   = [];

async function loadPresentation() {
  const deck    = document.getElementById('deck');
  const navDots = document.getElementById('nav-dots');
  const ctr     = document.getElementById('ctr');
  const prev    = document.getElementById('btn-prev');
  const next    = document.getElementById('btn-next');

  // -- fetch & inject all section slides --
  for (const url of TEMPLATE_FILES) {
    try {
      const res  = await fetch(url);
      if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
      const text = await res.text();
      const parser = new DOMParser();
      const doc    = parser.parseFromString(text, 'text/html');
      
      // Extract slides and dot buttons from the fetched file
      const fetchedSlides = doc.querySelectorAll('section.slide');
      const fetchedDots   = doc.querySelectorAll('.nav-mid .dot');

      fetchedSlides.forEach((sec, i) => {
        // remove 'active' class — we control that ourselves
        sec.classList.remove('active');
        deck.appendChild(sec);
        
        // Create a corresponding dot in index.html
        const btn = document.createElement('button');
        btn.className = 'dot';
        // Get the title from the corresponding dot in the template if available
        if (fetchedDots[i]) {
          btn.title = fetchedDots[i].title;
        }
        navDots.insertBefore(btn, ctr);
      });
    } catch(e) {
      console.error('Failed to load', url, e);
    }
  }

  // remove loading placeholder
  const loading = document.getElementById('loading');
  if (loading) loading.remove();

  // -- build slides & dots arrays --
  slides = Array.from(deck.querySelectorAll('section.slide'));
  dots   = Array.from(navDots.querySelectorAll('.dot'));

  prev.addEventListener('click', () => go(cur - 1));
  next.addEventListener('click', () => go(cur + 1));
  dots.forEach((d, i) => d.addEventListener('click', () => go(i)));
  
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') go(cur + 1);
    if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   go(cur - 1);
  });

  function go(n) {
    if (slides[cur]) slides[cur].classList.remove('active');
    if (dots[cur])   dots[cur].classList.remove('on');
    cur = Math.max(0, Math.min(n, slides.length - 1));
    if (slides[cur]) slides[cur].classList.add('active');
    if (dots[cur])   dots[cur].classList.add('on');
    ctr.textContent = (cur + 1) + ' / ' + slides.length;
    prev.disabled = cur === 0;
    next.disabled = cur === slides.length - 1;
    const body = slides[cur] && slides[cur].querySelector('.s-body');
    if (body) body.scrollTop = 0;

    // -- voice logic --
    playVoiceForSlide(slides[cur]);
  }

  const audio = new Audio();
  function playVoiceForSlide(slide) {
    if (!slide) return;
    const voice = slide.getAttribute('data-voice');
    audio.pause();
    if (voice) {
      audio.src = voice;
      audio.play().catch(e => console.warn("Autoplay blocked or audio error:", e));
    }
  }

  // -- logo slider --
  function initSliders() {
    document.querySelectorAll('.linux-slider-box').forEach(box => {
      const imgs = Array.from(box.querySelectorAll('img'));
      if (imgs.length < 2) return;
      let idx = 0;
      setInterval(() => {
        imgs[idx].classList.remove('active');
        idx = (idx + 1) % imgs.length;
        imgs[idx].classList.add('active');
      }, 3000);
    });
  }
  initSliders();

  go(0);
}

loadPresentation();
</script>
</body>
</html>
